name: Mắt Diều Hâu Tự Động Quét Và Tiến Hóa

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Cho phép bấm chạy bằng tay

# Cấp quyền ghi để Mắt tự lưu tệp tín hiệu lên GitHub
permissions:
  contents: write

jobs:
  van-hanh-mat:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn Mắt
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # BƯỚC 1: ĐÓN XUNG ĐẠO HÀM TỪ NÃO (NẾU NÃO ĐÃ TỪNG GỬI SANG)
      - name: Lắng nghe đạo hàm từ Não gửi sang qua Internet
        run: |
          echo "📡 Đang kiểm tra xem Não có gửi đạo hàm sang không..."
          curl -s -f https://raw.githubusercontent.com/100048777766367/neuron/main/synapse_backward.json -o synapse_backward.json || echo "Chưa có đạo hàm mới từ Não."

      # BƯỚC 2: MẮT CHẠY TÍNH TOÁN (QUÉT ẢNH & TỰ CHỈNH KÍNH LÚP)
      - name: Vận hành nơ-ron Mắt
        run: python retina_split.py

      # BƯỚC 3: TỰ ĐỘNG ĐẨY TÍN HIỆU THỊ GIÁC LÊN ĐỂ NÃO NHÌN THẤY
      - name: Phát xung thị giác lên mạng cho Não
        run: |
          git config --global user.name "Retina-Eye-Bot"
          git config --global user.email "eye@retina.ai"
          git add synapse_forward.json
          git commit -m "👁️ [Xung Thị Giác] Mắt vừa quét xong ảnh mới [skip ci]" || echo "Không có tín hiệu mới"
          git push
