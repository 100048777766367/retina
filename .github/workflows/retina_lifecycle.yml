name: Vòng Đời Mắt Diều Hâu (Retina HA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '30 */6 * * *'

permissions:
  contents: write

jobs:
  run-retina:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn Mắt
        uses: actions/checkout@v7

      - name: Cài đặt Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

     # NẤC 1: XÚC TU PHẢ HỆ (TÌM NÃO GIA ĐÌNH)
      - name: Xúc tu vươn vòi tìm Não phả hệ
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_PARENT: ${{ github.event.repository.parent.owner.login }}
        run: python receptors/cascade_receptor.py

      # NẤC 3: ANTEN SỢI NẤM TOÀN CẦU (NẾU NÃO GIA ĐÌNH VẮNG MẶT)
      - name: Anten bắt sóng Bộ Não toàn cầu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python receptors/mesh_receptor.py

      # NẤC 2: MÀNG MIỄN DỊCH LỌC ĐẠO HÀM CHỐNG NỔ GRADIENT
      - name: Màng miễn dịch kiểm định đạo hàm
        run: python receptors/contract_receptor.py

      # VẬN HÀNH ĐỘNG CƠ GIÁC QUAN (TỰ VẶN LẠI KÍNH LÚP / LÔNG RUNG)
      - name: Vận hành Động cơ Giác quan
        run: python retina_engine.py  # (Hoặc cochlea_engine.py bên Tai)
        
      # LƯU VẾT TÍCH XUNG THỊ GIÁC VÀO GIT
      - name: Phát xung thị giác lên môi trường mạng
        run: |
          git config --global user.name "Retina-Eye-Bot"
          git config --global user.email "bot@retina.node"
          git add synapses/ synapse_forward.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "👁️ [Xung Thị Giác] Mắt vừa quét xong ảnh mới [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Không có biến đổi mới."
          fi
